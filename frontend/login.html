
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusIQ | Administrator Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top left, #383027, transparent 45%),
                #171513;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #24201C;
            border: 1px solid rgba(216,195,165,0.2);
            border-radius: 20px;
            padding: 38px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.35);
        }

        .login-brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: #D8C3A5;
            color: #171513;
            font-size: 23px;
            font-weight: 800;
        }

        .login-brand h1 {
            font-size: 26px;
            color: #F4EEE5;
        }

        .login-brand span {
            color: #D8C3A5;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading p {
            color: #D8C3A5;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .login-heading h2 {
            color: #F4EEE5;
            font-size: 25px;
            margin-bottom: 9px;
        }

        .login-heading span {
            color: #B9AA98;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #F4EEE5;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            background: #171513;
            border: 1px solid rgba(216,195,165,0.2);
            border-radius: 9px;
            outline: none;
            color: #F4EEE5;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #D8C3A5;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #D8C3A5;
            cursor: pointer;
            font-size: 12px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 9px;
            background: #D8C3A5;
            color: #171513;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #F4EEE5;
            transform: translateY(-2px);
        }

        .error-message {
            color: #E59B91;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
            min-height: 16px;
        }

        .login-footer {
            text-align: center;
            color: #B9AA98;
            font-size: 11px;
            margin-top: 28px;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-icon">C</div>
            <h1>Campus<span>IQ</span></h1>
        </div>

        <div class="login-heading">
            <p>ADMINISTRATOR PORTAL</p>
            <h2>Welcome Back!</h2>
            <span>Sign in to manage your campus.</span>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Administrator Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Sign-in to CampusIQ
            </button>

            <p class="error-message" id="errorMessage"></p>

        </form>

        <div class="login-footer">
            CampusIQ Smart Campus Management System<br>
            Administrator Access Only
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const errorMessage = document.getElementById("errorMessage");

        // Temporary demo credentials
        const adminEmail = "admin@campusiq.edu";
        const adminPassword = "Campus@123";

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }

        });

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (email === adminEmail && password === adminPassword) {

                sessionStorage.setItem("adminLoggedIn", "true");

                window.location.href = "dashboard.html";

            } else {

                errorMessage.textContent =
                    "Invalid email or password. Please try again.";

            }

        });
    </script>

</body>
</html>
