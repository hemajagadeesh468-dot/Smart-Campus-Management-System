
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusIQ | Student Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-auth-page">

    <main class="admin-auth-container">

        <div class="admin-auth-brand">
            <div class="admin-auth-icon">C</div>
            <h1>Campus<span>IQ</span></h1>
        </div>

        <div class="admin-auth-heading">
            <p>STUDENT PORTAL</p>
            <h2>Welcome Back!</h2>
            <span>Sign in to access your student portal.</span>
        </div>

        <form id="studentBackendLoginForm">

            <div class="admin-auth-field">
                <label for="studentEmail">Student Email</label>
                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>
            </div>

            <div class="admin-auth-field">
                <label for="studentPassword">Password</label>

                <div class="admin-auth-password">
                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button type="button" id="studentPasswordToggle">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="admin-auth-submit">
                Sign in to CampusIQ <span>→</span>
            </button>

            <p class="admin-auth-message" id="studentLoginMessage"
               aria-live="polite"></p>

        </form>

        <div class="admin-auth-footer">
            CampusIQ Smart Campus Management System<br>
            Student Access Only
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
